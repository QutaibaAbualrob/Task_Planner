<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Planner</title>

    <link rel="icon" href="./sourceImages/icons/book-solid_icon.svg" type="image/x-icon">
    <link rel="stylesheet" href="./style.css">
    
</head>

<body>
    
    <section class="container">
        <div class="emojiContainerTop">
            <img class="emojiSize emoji1" src="./sourceImages/icons/reshot-icon-love-U63YHWCBJX.svg" alt="">
            <img class="emojiSize emoji2" src="./sourceImages/icons/reshot-icon-sleep-VRJESPC759.svg" alt="">
        </div>

        <h1>AAUP IT Club Emoji Challange - Qutaiba Abualrob</h1>
        <div class="inputContainer">   
            <div class="inputContainerContent">
                <div>
                    <img class="inputIcon" src="./sourceImages/icons/face-smile-solid.svg" alt="book icon">
                    <input id="mainInput" placeholder="New todo">
                    
                </div>
                <p id="inputNote">Input must be longer than 5 characters and doesnt start with a number ✅</p>
                <br>
                <button id="inputButton">Do the magic 👌</button>
            </div>
        </div>

        <h1>Emojis List 😎</h1>
        <div class="listContainer">
            <div class="tabsContainer" id="tabsContainer">
                <button class="tabButton" id="all">All</button>
                <button class="tabButton" id="done">Done</button>
                <button class="tabButton" id="todo">ToDo</button>
            </div>

            <div class="scrollContainer" id="scrollContainer">
                <h3 id="noTasksHeader">No Emojis! 😞</h3>
                
                
                
                
                
            </div>

            <div class="deleteContainer">
                <button class="deleteButton" id="deleteDone">Delete Done Tasks</button>
                <button class="deleteButton"id="deleteAll">Delete Emojis 💀</button>
            </div>
        </div>

        <div class="emojiContainerBottom">
            <img class="emojiSize emoji3" src="./sourceImages/icons/reshot-icon-tongue-Y92VG4RXPL.svg" alt="">
            <img class="emojiSize emoji4" src="./sourceImages/icons/reshot-icon-sarcastic-S25WVERXCK.svg" alt="">
        </div>

    </section>

    <div class="alert" id="confirmOpreation">
        <div class="alertContent">
            <h1>Are you sure you want to do the opreation?<Br><Br>(Cant undo changes)</h1>
            <div>
                <button id="confirmOpreationButton">Confirm</button>
                <button id="cancelOpreationButton" >Cancel</button>
            </div>
        </div>
    </div>

    <div class="alertEdit" id="confirmEdit">
        <div class="alertEditContent">
            <h1>Rename Task</h1>
                <input id="alertEditContentInput" type="text" placeholder="New content">
                <p id="inputEditNote">Input must be longer than 5 characters and doesnt start with a number</p>
            <div>
                <button class="alertEditConfirmButton" id="confirmOpreationButtonEdit">Confirm</button>
                <button id="cancelOpreationButtonEdit" >Cancel</button>
            </div>
        </div>
    </div>
    


    <script src="./script.js"></script>
</body>

</html>
